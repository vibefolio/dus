name: Deploy dus to NCP Docker

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dlab-website-app:latest
  CONTAINER: dlab-website-app
  PROJECT_PATH: /root/projects/dlab-website
  APP_PORT: 4040

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --load -t ${{ env.IMAGE_NAME }} .

      - name: Rollback snapshot
        run: docker tag ${{ env.IMAGE_NAME }} dlab-website-app:previous 2>/dev/null || echo "최초 배포 — 스냅샷 없음"

      - name: Deploy
        run: |
          set -e
          cd ${{ env.PROJECT_PATH }}

          echo "=== docker compose up ==="
          docker compose up -d --no-build --no-deps --wait dlab-website-app

          echo "=== db:migrate ==="
          docker compose exec -T dlab-website-app bin/rails db:migrate 2>/dev/null || echo "⚠️ 마이그레이션 스킵"

          echo "=== health check ==="
          if curl -sf http://localhost:${{ env.APP_PORT }}/up; then
            echo "✅ 배포 완료"
            docker exec npm-app-1 nginx -s reload || true
          else
            echo "❌ 헬스체크 실패 — previous 이미지로 롤백"
            docker logs ${{ env.CONTAINER }} --tail 30
            docker tag dlab-website-app:previous ${{ env.IMAGE_NAME }} 2>/dev/null && \
            docker compose up -d --no-build --no-deps --wait dlab-website-app && \
            echo "🔄 롤백 완료" || echo "⚠️ 롤백도 실패 — 수동 확인 필요"
            exit 1
          fi

      - name: Cleanup old images
        if: always()
        run: docker image prune -f
